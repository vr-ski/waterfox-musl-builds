# This workflow is managed by gh actions-lock.

name: Scheduled Waterfox musl build

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waterfox-scheduled-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: [self-hosted, linux, x64, waterfox-builder]

    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      waterfox_tag: ${{ steps.check.outputs.waterfox_tag }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check latest upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(curl -fsSL \
            "https://api.github.com/repos/BrowserWorks/waterfox/releases/latest" \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' \
            | head -1)"

          [ -n "$TAG" ] || {
            echo "GitHub API returned no tag_name" >&2
            exit 1
          }

          echo "Latest upstream tag: $TAG"
          echo "waterfox_tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No release exists for $TAG; build required."
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check

    if: needs.check.outputs.should_build == 'true'

    uses: ./.github/workflows/build_reusable.yml

    with:
      waterfox_tag: ${{ needs.check.outputs.waterfox_tag }}
      nspr_version: ""
      do_release: true
      draft_release: false

    secrets: inherit
